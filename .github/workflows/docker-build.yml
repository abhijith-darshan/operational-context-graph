---
name: Docker Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      services: ${{ steps.set.outputs.services }}
      include: ${{ steps.set.outputs.include }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate paths-filter config
        if: github.event_name != 'workflow_dispatch'
        run: |
          shared="
            - 'proto/**'
            - 'buf.yaml'
            - 'buf.gen.yaml'
            - '.github/workflows/docker-build.yml'
            - '.github/services.json'"

          jq -c '.[]' .github/services.json | while read -r svc; do
            name=$(echo "$svc" | jq -r '.name')
            has_paths=$(echo "$svc" | jq 'has("paths")')
            echo "${name}:"
            if [ "$has_paths" = "true" ]; then
              echo "$svc" | jq -r '.paths[] | "  - '\''" + . + "'\''"'
            else
              echo "  - 'services/${name}/**'"
            fi
            echo "$shared"
          done > .github/services-filter.yml

      - name: Filter changed services
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/services-filter.yml

      - name: Build matrix
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed=$(jq -c '[.[].name]' .github/services.json)
          else
            changed="$FILTER_CHANGES"
          fi

          include=$(jq -c --argjson changed "$changed" '
            map(select(.name as $n | $changed | index($n) != null))
            | map({service: .name, context: .context})
          ' .github/services.json)

          echo "services=$changed" >> "$GITHUB_OUTPUT"
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "Will build: $changed"

  build-push-sign:
    name: Build, push, and sign (${{ matrix.service }})
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.include) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ github.sha }}
            type=sha,enable=true,format=short,prefix=

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          platforms: |
            linux/amd64
            linux/arm64

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}