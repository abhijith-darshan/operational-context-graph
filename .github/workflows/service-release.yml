---
name: Release Build and Push

on:
  push:
    tags:
      - "*/v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. data-ingestion/v1.2.3)"
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: Build (${{ steps.parse.outputs.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse service and version from tag
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${{ github.event.inputs.tag }}"
          else
            raw="${GITHUB_REF#refs/tags/}"
          fi
          service="${raw%/v*}"
          version="${raw#${service}/}"
          context=$(jq -r --arg name "$service" '.[] | select(.name == $name) | .context' .github/services.json)
          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "context=$context" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ steps.parse.outputs.service }}
          tags: |
            type=semver,pattern={{version}},prefix=v,value=${{ steps.parse.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},prefix=v,value=${{ steps.parse.outputs.version }}
            type=semver,pattern={{major}},enable=${{ !startsWith(steps.parse.outputs.version, 'v0.') }},prefix=v,value=${{ steps.parse.outputs.version }}
            type=raw,value=${{ github.sha }}
            type=sha,enable=true,format=short,prefix=

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.parse.outputs.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          platforms: |
            linux/amd64
            linux/arm64

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}