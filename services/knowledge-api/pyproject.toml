[project]
name = "knowledge-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi==0.143.1",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_api"]